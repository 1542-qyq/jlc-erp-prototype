<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增认证</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: rgba(0, 0, 0, 0.35);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      width: 620px;
      height: 400px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .import-btn {
      height: 30px;
      padding: 0 14px;
      font-size: 13px;
      color: #409eff;
      background: #fff;
      border: 1px solid #409eff;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .import-btn:hover {
      color: #fff;
      background: #409eff;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #999;
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      flex: 1;
      padding: 24px 32px;
    }

    .form-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .form-label {
      width: 150px;
      text-align: right;
      padding-right: 12px;
      padding-top: 8px;
      font-size: 14px;
      color: #333;
      flex-shrink: 0;
    }

    .form-label .required {
      color: #f56c6c;
      margin-right: 4px;
    }

    .form-control {
      flex: 1;
      min-width: 0;
    }

    .input-with-btn {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-with-btn input[type="text"] {
      flex: 1;
    }

    input[type="text"],
    select {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input[type="text"]::placeholder {
      color: #bfbfbf;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #409eff;
    }

    .error-msg {
      font-size: 12px;
      color: #f56c6c;
      margin-top: 6px;
    }

    .upload-hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: "⌄";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-60%);
      color: #999;
      font-size: 18px;
      pointer-events: none;
    }

    select {
      appearance: none;
      color: #999;
    }

    .number-stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      overflow: hidden;
    }

    .stepper-btn {
      width: 36px;
      height: 34px;
      background: #fff;
      border: none;
      font-size: 18px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stepper-btn:hover {
      color: #409eff;
    }

    .stepper-input {
      width: 60px;
      height: 34px;
      border: none;
      border-left: 1px solid #d9d9d9;
      border-right: 1px solid #d9d9d9;
      text-align: center;
      font-size: 14px;
      color: #333;
      outline: none;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-left: 10px;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-top: 6px;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 20px;
      background: #409eff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-label {
      font-size: 14px;
      color: #409eff;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid #f0f0f0;
    }

    .btn {
      min-width: 72px;
      height: 34px;
      padding: 0 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #409eff;
      color: #fff;
      border: 1px solid #409eff;
    }

    .btn-primary:hover {
      background: #66b1ff;
      border-color: #66b1ff;
    }

    .btn-default {
      background: #fff;
      color: #606266;
      border: 1px solid #dcdfe6;
    }

    .btn-default:hover {
      color: #409eff;
      border-color: #c6e2ff;
      background: #ecf5ff;
    }
  </style>
</head>
<body>
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">新增认证</span>
      <button class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>用户名/团队标识：</div>
        <div class="form-control">
          <div class="input-with-btn">
            <input type="text" placeholder="多个用户名/团队标识用;分隔（单次上限200个）">
            <button class="import-btn">导入</button>
          </div>
          <div class="upload-hint">支持xlsx/xls格式，自动去空格、去空行、去重</div>
        </div>
      </div>

      <div class="form-item">
        <div class="form-label"><span class="required">*</span>关联标记：</div>
        <div class="form-control select-wrapper">
          <select>
            <option value="" disabled="" selected="">请选择</option>
          </select>
        </div>
      </div>

      <div class="form-item">
        <div class="form-label"><span class="required">*</span>排序：</div>
        <div class="form-control">
          <div class="number-stepper">
            <button class="stepper-btn">−</button>
            <input type="text" class="stepper-input" value="1">
            <button class="stepper-btn">+</button>
          </div>
          <span class="hint">（排序越大越靠前）</span>
        </div>
      </div>

      <div class="form-item">
        <div class="form-label"><span class="required">*</span>状态：</div>
        <div class="form-control">
          <div class="toggle">
            <span class="toggle-label">启用</span>
            <div class="toggle-switch"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary">确认</button>
      <button class="btn btn-default">取消</button>
    </div>
  </div>


</body></html>
